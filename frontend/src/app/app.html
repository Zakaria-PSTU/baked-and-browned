<div class="min-h-screen bg-stone-50 text-stone-900">
  <header class="border-b border-stone-200 bg-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4">
      <a routerLink="/" class="text-xl font-semibold tracking-tight">{{ brandName }}</a>
      <nav aria-label="Account" class="flex items-center gap-4 text-sm">
        <a
          routerLink="/cart"
          routerLinkActive="font-semibold"
          class="hover:underline"
          data-testid="cart-link"
          >Cart
          @if (cartCount() > 0) {
            <span class="ml-1 rounded-full bg-amber-800 px-2 py-0.5 text-xs text-white">{{
              cartCount()
            }}</span>
          }
        </a>
        @if (user(); as u) {
          @if (isAdmin()) {
            <a routerLink="/admin" routerLinkActive="font-semibold" class="hover:underline"
              >Dashboard</a
            >
          }
          <a routerLink="/account" routerLinkActive="font-semibold" class="hover:underline">{{
            u.fullName
          }}</a>
          <button type="button" class="hover:underline" (click)="logout()">Log out</button>
        } @else {
          <a routerLink="/login" routerLinkActive="font-semibold" class="hover:underline">Log in</a>
          <a
            routerLink="/register"
            class="rounded-md bg-amber-800 px-3 py-1.5 font-medium text-white hover:bg-amber-900"
            >Register</a
          >
        }
      </nav>
    </div>
  </header>
  <main class="mx-auto max-w-6xl px-4 py-8">
    <router-outlet />
  </main>
</div>
